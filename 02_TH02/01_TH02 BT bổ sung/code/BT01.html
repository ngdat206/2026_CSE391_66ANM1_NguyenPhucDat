<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BÀI TẬP 1</title>
  <link rel="stylesheet" href="baitap1.css">
</head>
<body>
  <div class="form-container">
    <p class="form-title">Get in touch with us by filling contact form below</p>

    <div class="form-row">
      <input type="text" placeholder="* Enter your full name">
      <input type="email" placeholder="* Enter your email address">
    </div>

    <div class="form-row">
      <input type="text" placeholder="Enter your subject">
    </div>

    <div class="form-row">
      <textarea placeholder="* Your message here..."></textarea>
    </div>

    <div class="form-footer">
      <button class="btn-send">Send message</button>
      <span class="note">* Please fill all required form field, thanks!</span>
    </div>
  </div>

</body>
</html>
